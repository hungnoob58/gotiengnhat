<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Luyện Gõ N5 Full Kho Từ</title>

    <!-- Cấu hình Web App (PWA) chuẩn cho iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Luyện Gõ N5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/330/330582.png">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --secondary: #5856d6;
            --text-dark: #1c1c1e;
            --text-muted: #8e8e93;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-header {
            text-align: center;
        }

        .app-banner {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 6px;
            background-color: #e5e5ea;
        }

        h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 700;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d1d1d6;
            background-color: #f2f2f7;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            -webkit-appearance: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border: 1px solid #e5e5ea;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-item .value {
            font-size: 18px;
            font-weight: bold;
        }

        #timer { color: var(--danger); }
        #combo { color: var(--warning); }
        #score { color: var(--primary); }

        .card {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .word-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #f2f2f7;
        }

        .japanese-text {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-dark);
            line-height: 1.2;
            -webkit-user-select: text;
            user-select: text;
        }

        .romaji-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .meaning-text {
            font-size: 13px;
            color: var(--primary);
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            outline: none;
            text-align: center;
            -webkit-user-select: text;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .tip-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        button.danger {
            background-color: var(--danger);
        }

        .hidden {
            display: none !important;
        }

        .result-screen {
            text-align: center;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .result-image {
            width: 70px;
            height: 70px;
        }

        .grade-badge {
            font-size: 20px;
            font-weight: bold;
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500&auto=format&fit=crop" alt="Japan Banner" class="app-banner">
        <h1>🇯🇵 N5 Typing Master</h1>
    </div>

    <!-- Bộ chọn danh mục & độ khó -->
    <div class="controls" id="controls">
        <select id="categorySelect">
            <option value="all">🔥 Tổng hợp tất cả N5 (Full Bộ)</option>
            <option value="katakana">Chữ cứng Katakana N5</option>
            <option value="hiragana">Từ vựng Hiragana N5</option>
            <option value="sentences">Mẫu câu tự luận N5</option>
        </select>
        <select id="difficultySelect">
            <option value="60">Thời gian: Dễ (60 Giây)</option>
            <option value="45">Thời gian: Trung bình (45 Giây)</option>
            <option value="30">Thời gian: Khó (30 Giây)</option>
        </select>
    </div>

    <!-- Thanh chỉ số -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="label">Thời gian</div>
            <div class="value" id="timer">60s</div>
        </div>
        <div class="stat-item">
            <div class="label">Combo</div>
            <div class="value" id="combo">x0</div>
        </div>
        <div class="stat-item">
            <div class="label">Điểm số</div>
            <div class="value" id="score">0</div>
        </div>
    </div>

    <!-- Khung gõ bài -->
    <div id="gamePlayArea" class="hidden">
        <div class="card">
            <img id="targetImage" src="" alt="Illustration" class="word-image">
            <div class="japanese-text" id="targetText">コーヒー</div>
            <div class="romaji-text" id="targetRomaji">ko-hi-</div>
            <div class="meaning-text" id="targetMeaning">Cà phê</div>
        </div>

        <div class="input-group" style="margin-top: 8px;">
            <input type="text" id="userInput" placeholder="Gõ bằng bàn phím Nhật..." autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="tip-text">💡 Dùng bàn phím Kana/Romaji Tiếng Nhật để gõ.</div>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div id="resultArea" class="card result-screen hidden">
        <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" alt="Trophy" class="result-image">
        <h2>🎉 KẾT THÚC BÀI THI!</h2>
        <p>Điểm số: <strong id="finalScore" style="color: var(--primary); font-size: 20px;">0</strong></p>
        <p>Số từ gõ đúng: <strong id="finalCount">0</strong></p>
        <div class="grade-badge" id="finalGrade">Rank: S</div>
    </div>

    <!-- Nút bắt đầu / dừng -->
    <button id="actionBtn">Bắt Đầu Luyện Gõ</button>
</div>

<script>
    // FULL BỘ TỪ VỰNG CHUẨN JLPT N5
    const vocabulary = {
        katakana: [
            { text: "コーヒー", romaji: "ko-hi-", meaning: "Cà phê", score: 15, img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=300" },
            { text: "ホテル", romaji: "hoteru", meaning: "Khách sạn", score: 15, img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300" },
            { text: "タクシー", romaji: "takushi-", meaning: "Xe taxi", score: 15, img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=300" },
            { text: "バス", romaji: "basu", meaning: "Xe buýt", score: 10, img: "https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=300" },
            { text: "パソコン", romaji: "pasokon", meaning: "Máy tính cá nhân", score: 15, img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" },
            { text: "テレビ", romaji: "terebi", meaning: "Tivi", score: 10, img: "https://images.unsplash.com/photo-1593784991095-a205069470b6?w=300" },
            { text: "カメラ", romaji: "kamera", meaning: "Máy ảnh", score: 10, img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=300" },
            { text: "パン", romaji: "pan", meaning: "Bánh mì", score: 10, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { text: "ラジオ", romaji: "rajio", meaning: "Đài Radio", score: 10, img: "https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=300" },
            { text: "デパート", romaji: "depa-to", meaning: "Bách hóa tổng hợp", score: 15, img: "https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=300" },
            { text: "レストラン", romaji: "resutoran", meaning: "Nhà hàng", score: 15, img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300" },
            { text: "ビル", romaji: "biru", meaning: "Tòa nhà cao tầng", score: 10, img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=300" },
            { text: "ニュース", romaji: "nyu-su", meaning: "Tin tức", score: 15, img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=300" },
            { text: "ドア", romaji: "doa", meaning: "Cửa chính", score: 10, img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=300" },
            { text: "ベッド", romaji: "beddo", meaning: "Giường ngủ", score: 12, img: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=300" },
            { text: "シャツ", romaji: "shatsu", meaning: "Áo sơ mi", score: 12, img: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=300" },
            { text: "ネクタイ", romaji: "nekutai", meaning: "Cà vạt", score: 15, img: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=300" },
            { text: "ノート", romaji: "no-to", meaning: "Vở / Sổ tay", score: 10, img: "https://images.unsplash.com/photo-1517842645767-c639042777db?w=300" },
            { text: "ボールペン", romaji: "bo-rupen", meaning: "Bút bi", score: 15, img: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=300" },
            { text: "トイレ", romaji: "toire", meaning: "Nhà vệ sinh", score: 10, img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=300" }
        ],
        hiragana: [
            { text: "わたし", romaji: "watashi", meaning: "Tôi", score: 10, img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" },
            { text: "せんせい", romaji: "sensei", meaning: "Thầy/cô giáo", score: 12, img: "https://images.unsplash.com/photo-1577896851231-70ef18881754?w=300" },
            { text: "がくせい", romaji: "gakusei", meaning: "Học sinh/sinh viên", score: 12, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=300" },
            { text: "だいがく", romaji: "daigaku", meaning: "Đại học", score: 12, img: "https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?w=300" },
            { text: "ほん", romaji: "hon", meaning: "Sách", score: 10, img: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=300" },
            { text: "たべます", romaji: "tabemasu", meaning: "Ăn", score: 12, img: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300" },
            { text: "のみます", romaji: "nomimasu", meaning: "Uống", score: 12, img: "https://images.unsplash.com/photo-1544145945-f90425340c7e?w=300" },
            { text: "いきます", romaji: "ikimasu", meaning: "Đi", score: 12, img: "https://images.unsplash.com/photo-1476514525535-ce74f458149d?w=300" },
            { text: "きます", romaji: "kimasu", meaning: "Đến", score: 10, img: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=300" },
            { text: "かえります", romaji: "kaerimasu", meaning: "Trở về", score: 15, img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=300" },
            { text: "みず", romaji: "mizu", meaning: "Nước", score: 10, img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=300" },
            { text: "おちゃ", romaji: "ocha", meaning: "Trà xanh", score: 12, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=300" },
            { text: "ごはん", romaji: "gohan", meaning: "Cơm / Bữa ăn", score: 10, img: "https://images.unsplash.com/photo-1536304993881-ff6e90fc0a65?w=300" },
            { text: "さかな", romaji: "sakana", meaning: "Cá", score: 10, img: "https://images.unsplash.com/photo-1534483509719-3feaee7c30da?w=300" },
            { text: "にく", romaji: "niku", meaning: "Thịt", score: 10, img: "https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=300" },
            { text: "たまご", romaji: "tamago", meaning: "Trứng", score: 12, img: "https://images.unsplash.com/photo-1506976785307-8732e854ad03?w=300" },
            { text: "やさい", romaji: "yasai", meaning: "Rau", score: 12, img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=300" },
            { text: "くだもの", romaji: "kudamono", meaning: "Hoa quả", score: 15, img: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=300" },
            { text: "ともだち", romaji: "tomodachi", meaning: "Bạn bè", score: 15, img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=300" },
            { text: "かぞく", romaji: "kazoku", meaning: "Gia đình", score: 12, img: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=300" }
        ],
        sentences: [
            { text: "わたしはがくせいです。", romaji: "Watashi wa gakusei desu.", meaning: "Tôi là sinh viên.", score: 30, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=300" },
            { text: "きょうはいいてんきですね。", romaji: "Kyou wa ii tenki desu ne.", meaning: "Hôm nay trời đẹp nhỉ.", score: 35, img: "https://images.unsplash.com/photo-1601297183305-6df142704ea2?w=300" },
            { text: "あしたしけんがあります。", romaji: "Ashita shiken ga arimasu.", meaning: "Ngày mai có bài thi.", score: 35, img: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=300" },
            { text: "まいにちにほんごをべんきょうします。", romaji: "Mainichi nihongo wo benkyou shimasu.", meaning: "Tôi học tiếng Nhật mỗi ngày.", score: 40, img: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300" },
            { text: "これはいくらですか。", romaji: "Kore wa ikura desu ka.", meaning: "Cái này bao nhiêu tiền?", score: 30, img: "https://images.unsplash.com/photo-1556742049-0a67d10e53a9?w=300" },
            { text: "いまなんじですか。", romaji: "Ima nanji desu ka.", meaning: "Bây giờ là mấy giờ?", score: 25, img: "https://images.unsplash.com/photo-1508962914676-134849a727f0?w=300" },
            { text: "どこへいきますか。", romaji: "Doko he ikimasu ka.", meaning: "Bạn đi đâu đấy?", score: 30, img: "https://images.unsplash.com/photo-1503220317375-aaad61436b1b?w=300" },
            { text: "すみません、トイレはどこですか。", romaji: "Sumimasen, toire wa doko desu ka.", meaning: "Xin lỗi, nhà vệ sinh ở đâu?", score: 40, img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=300" },
            { text: "はじめまして、どうぞよろしく。", romaji: "Hajimemashite, douzo yoroshiku.", meaning: "Rất hân hạnh được làm quen.", score: 40, img: "https://images.unsplash.com/photo-1521791136064-7986c2920216?w=300" },
            { text: "ありがとうごさいます。", romaji: "Arigatou gozaimasu.", meaning: "Xin cảm ơn bạn rất nhiều.", score: 35, img: "https://images.unsplash.com/photo-1516726817505-f5ed825624d8?w=300" }
        ]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let combo = 0;
    let typedCount = 0;
    let timeRemaining = 60;
    let timerInterval = null;
    let isPlaying = false;

    const categorySelect = document.getElementById('categorySelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const controls = document.getElementById('controls');
    const timerEl = document.getElementById('timer');
    const comboEl = document.getElementById('combo');
    const scoreEl = document.getElementById('score');
    const gamePlayArea = document.getElementById('gamePlayArea');
    const resultArea = document.getElementById('resultArea');
    const targetImage = document.getElementById('targetImage');
    const targetText = document.getElementById('targetText');
    const targetRomaji = document.getElementById('targetRomaji');
    const targetMeaning = document.getElementById('targetMeaning');
    const userInput = document.getElementById('userInput');
    const actionBtn = document.getElementById('actionBtn');

    actionBtn.addEventListener('click', () => {
        if (isPlaying) {
            endGame();
        } else {
            startGame();
        }
    });

    userInput.addEventListener('input', (e) => {
        checkInput(e.target.value);
    });

    function startGame() {
        const cat = categorySelect.value;
        if (cat === 'all') {
            currentQuestions = [
                ...vocabulary.katakana,
                ...vocabulary.hiragana,
                ...vocabulary.sentences
            ].sort(() => Math.random() - 0.5);
        } else {
            currentQuestions = [...vocabulary[cat]].sort(() => Math.random() - 0.5);
        }
        
        currentIndex = 0;
        score = 0;
        combo = 0;
        typedCount = 0;
        timeRemaining = parseInt(difficultySelect.value);
        isPlaying = true;

        controls.classList.add('hidden');
        resultArea.classList.add('hidden');
        gamePlayArea.classList.remove('hidden');
        actionBtn.textContent = 'Hủy / Dừng Lại';
        actionBtn.classList.add('danger');

        scoreEl.textContent = '0';
        comboEl.textContent = 'x0';
        timerEl.textContent = timeRemaining + 's';
        userInput.value = '';

        loadQuestion();
        userInput.focus();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timerEl.textContent = timeRemaining + 's';
            if (timeRemaining <= 0) {
                endGame();
            }
        }, 1000);
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
        }
        const q = currentQuestions[currentIndex];
        targetImage.src = q.img;
        targetText.textContent = q.text;
        targetRomaji.textContent = q.romaji;
        targetMeaning.textContent = "Nghĩa: " + q.meaning;
    }

    function checkInput(val) {
        if (!isPlaying) return;
        const q = currentQuestions[currentIndex];
        
        if (val.trim() === q.text) {
            combo++;
            typedCount++;
            score += q.score * combo;

            scoreEl.textContent = score;
            comboEl.textContent = 'x' + combo;
            userInput.value = '';

            currentIndex++;
            loadQuestion();
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        isPlaying = false;

        gamePlayArea.classList.add('hidden');
        controls.classList.remove('hidden');
        resultArea.classList.remove('hidden');

        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalCount').textContent = typedCount;
        document.getElementById('finalGrade').textContent = "Rank: " + getGrade(score);

        actionBtn.textContent = 'Luyện Lại Bài Khác';
        actionBtn.classList.remove('danger');
    }

    function getGrade(sc) {
        if (sc >= 250) return "S (Xuất Sắc)";
        if (sc >= 150) return "A (Rất Tốt)";
        if (sc >= 80)  return "B (Khá)";
        return "C (Cần Cố Gắng)";
    }
</script>
</body>
</html>
