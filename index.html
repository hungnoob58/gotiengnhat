<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Gõ N5</title>

    <!-- CẤU HÌNH BIẾN NÓ THÀNH APP THẬT (KHÔNG MỞ TRÌNH DUYỆT WEB) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Luyện Gõ N5">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- ICON MÀN HÌNH CHÍNH IPHONE / FAVICON -->
    <link rel="apple-touch-icon" href="https://cdn.phototourl.com/free/2026-07-30-ae9f6bed-e540-420f-b5e5-3cad19731ab0.jpg">
    <link rel="icon" type="image/jpeg" href="https://cdn.phototourl.com/free/2026-07-30-ae9f6bed-e540-420f-b5e5-3cad19731ab0.jpg">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --text-dark: #1c1c1e;
            --text-muted: #8e8e93;
            --danger: #ff3b30;
            --warning: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 12px;
            /* Thêm padding top chống che bởi tai thỏ iPhone */
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-banner {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 20px;
            color: var(--primary);
            text-align: center;
        }

        .controls select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #d1d1d6;
            background-color: #f2f2f7;
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border: 1px solid #e5e5ea;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item .label { font-size: 10px; color: var(--text-muted); }
        .stat-item .value { font-size: 18px; font-weight: bold; }
        #timer { color: var(--danger); }
        #combo { color: var(--warning); }
        #score { color: var(--primary); }

        .card {
            background: #fff;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .word-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .japanese-text { font-size: 24px; font-weight: bold; }
        .romaji-text { font-size: 13px; color: var(--text-muted); }
        .meaning-text { font-size: 13px; color: var(--primary); }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button.danger { background-color: var(--danger); }
        .hidden { display: none !important; }

        /* RANK DISPLAY */
        .rank-badge {
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
        }
        .rank-S { color: #ff2d55; }
        .rank-A { color: #5856d6; }
        .rank-B { color: #007aff; }
        .rank-C { color: #34c759; }
        .rank-D { color: #ff9500; }
        .rank-F { color: #8e8e93; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <img id="appLogo" src="https://cdn.phototourl.com/free/2026-07-30-ae9f6bed-e540-420f-b5e5-3cad19731ab0.jpg" alt="Logo" class="app-banner">
        <h1>🇯🇵 N5 Typing Master</h1>
    </div>

    <div class="controls" id="controls">
        <select id="categorySelect">
            <option value="all">🔥 Tổng hợp tất cả N5 (Full Kho Từ)</option>
            <option value="katakana">Chữ cứng Katakana</option>
            <option value="hiragana">Từ vựng Hiragana</option>
            <option value="sentences">Mẫu câu giao tiếp</option>
        </select>
        <select id="difficultySelect">
            <option value="60">Thời gian: 60 Giây</option>
            <option value="45">Thời gian: 45 Giây</option>
            <option value="30">Thời gian: 30 Giây</option>
        </select>
    </div>

    <div class="stats-bar">
        <div class="stat-item"><div class="label">Thời gian</div><div class="value" id="timer">60s</div></div>
        <div class="stat-item"><div class="label">Combo</div><div class="value" id="combo">x0</div></div>
        <div class="stat-item"><div class="label">Điểm số</div><div class="value" id="score">0</div></div>
    </div>

    <div id="gamePlayArea" class="hidden">
        <div class="card">
            <img id="targetImage" src="" alt="Icon" class="word-image">
            <div class="japanese-text" id="targetText">コーヒー</div>
            <div class="romaji-text" id="targetRomaji">ko-hi-</div>
            <div class="meaning-text" id="targetMeaning">Cà phê</div>
        </div>

        <div style="margin-top: 10px;">
            <input type="text" id="userInput" placeholder="Gõ từ tiếng Nhật..." autocomplete="off">
        </div>
    </div>

    <div id="resultArea" class="card hidden">
        <h2>🎉 KẾT THÚC!</h2>
        <div id="rankBadge" class="rank-badge rank-F">F</div>
        <p style="font-size: 15px; margin-bottom: 5px;">Xếp hạng: <strong id="rankTitle">Tập sự</strong></p>
        <p>Điểm: <strong id="finalScore" style="color:var(--primary);">0</strong></p>
        <p>Số từ đúng: <strong id="finalCount">0</strong></p>
    </div>

    <button id="actionBtn">Bắt Đầu Luyện Gõ</button>
</div>

    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let combo = 0;
    let typedCount = 0;
    let timeRemaining = 60;
    let timerInterval = null;
    let isPlaying = false;

    const categorySelect = document.getElementById('categorySelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const controls = document.getElementById('controls');
    const timerEl = document.getElementById('timer');
    const comboEl = document.getElementById('combo');
    const scoreEl = document.getElementById('score');
    const gamePlayArea = document.getElementById('gamePlayArea');
    const resultArea = document.getElementById('resultArea');
    const targetImage = document.getElementById('targetImage');
    const targetText = document.getElementById('targetText');
    const targetRomaji = document.getElementById('targetRomaji');
    const targetMeaning = document.getElementById('targetMeaning');
    const userInput = document.getElementById('userInput');
    const actionBtn = document.getElementById('actionBtn');

    actionBtn.addEventListener('click', () => {
        if (isPlaying) endGame();
        else startGame();
    });

    userInput.addEventListener('input', (e) => checkInput(e.target.value));

    function startGame() {
        const cat = categorySelect.value;
        if (cat === 'all') {
            currentQuestions = [...vocabulary.katakana, ...vocabulary.hiragana, ...vocabulary.sentences].sort(() => Math.random() - 0.5);
        } else {
            currentQuestions = [...vocabulary[cat]].sort(() => Math.random() - 0.5);
        }
        
        currentIndex = 0; score = 0; combo = 0; typedCount = 0;
        timeRemaining = parseInt(difficultySelect.value);
        isPlaying = true;

        controls.classList.add('hidden');
        resultArea.classList.add('hidden');
        gamePlayArea.classList.remove('hidden');
        actionBtn.textContent = 'Dừng Lại';
        actionBtn.classList.add('danger');

        scoreEl.textContent = '0';
        comboEl.textContent = 'x0';
        timerEl.textContent = timeRemaining + 's';
        userInput.value = '';

        loadQuestion();
        userInput.focus();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timerEl.textContent = timeRemaining + 's';
            if (timeRemaining <= 0) endGame();
        }, 1000);
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
        }
        const q = currentQuestions[currentIndex];
        targetImage.src = q.img;
        targetText.textContent = q.text;
        targetRomaji.textContent = q.romaji;
        targetMeaning.textContent = "Nghĩa: " + q.meaning;
    }

    function checkInput(val) {
        if (!isPlaying) return;
        const q = currentQuestions[currentIndex];
        if (val.trim() === q.text) {
            combo++; typedCount++;
            score += q.score * combo;
            scoreEl.textContent = score;
            comboEl.textContent = 'x' + combo;
            userInput.value = '';
            currentIndex++;
            loadQuestion();
        }
    }

    function getRank(score) {
        if (score >= 1000) return { rank: "S", title: "Thần Đồng Tiếng Nhật 🏆", class: "rank-S" };
        if (score >= 600)  return { rank: "A", title: "Cao Thủ Luyện Gõ 🔥", class: "rank-A" };
        if (score >= 350)  return { rank: "B", title: "Tay Gõ Chuyên Nghiệp ✨", class: "rank-B" };
        if (score >= 180)  return { rank: "C", title: "Đã Quen Tay 👏", class: "rank-C" };
        if (score >= 80)   return { rank: "D", title: "Người Mới Bắt Đầu 🐣", class: "rank-D" };
        return { rank: "F", title: "Cần Cố Gắng Thêm 😅", class: "rank-F" };
    }

    function endGame() {
        clearInterval(timerInterval);
        isPlaying = false;
        gamePlayArea.classList.add('hidden');
        controls.classList.remove('hidden');
        resultArea.classList.remove('hidden');

        const rankInfo = getRank(score);
        const rankBadge = document.getElementById('rankBadge');
        rankBadge.textContent = rankInfo.rank;
        rankBadge.className = 'rank-badge ' + rankInfo.class;
        document.getElementById('rankTitle').textContent = rankInfo.title;

        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalCount').textContent = typedCount;
        actionBtn.textContent = 'Chơi Lại';
        actionBtn.classList.remove('danger');
    }
</script>
