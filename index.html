<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Luyện Gõ N5</title>

    <!-- Cấu hình Web App (PWA) chuẩn cho iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Luyện Gõ N5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/330/330582.png">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --secondary: #5856d6;
            --text-dark: #1c1c1e;
            --text-muted: #8e8e93;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-header {
            text-align: center;
        }

        .app-banner {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 6px;
            background-color: #e5e5ea;
        }

        h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 700;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d1d1d6;
            background-color: #f2f2f7;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            -webkit-appearance: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border: 1px solid #e5e5ea;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-item .value {
            font-size: 18px;
            font-weight: bold;
        }

        #timer { color: var(--danger); }
        #combo { color: var(--warning); }
        #score { color: var(--primary); }

        .card {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .word-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #f2f2f7;
        }

        .japanese-text {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-dark);
            line-height: 1.2;
            -webkit-user-select: text;
            user-select: text;
        }

        .romaji-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .meaning-text {
            font-size: 13px;
            color: var(--primary);
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            outline: none;
            text-align: center;
            -webkit-user-select: text;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .tip-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        button.danger {
            background-color: var(--danger);
        }

        .hidden {
            display: none !important;
        }

        .result-screen {
            text-align: center;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .result-image {
            width: 70px;
            height: 70px;
        }

        .grade-badge {
            font-size: 20px;
            font-weight: bold;
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500&auto=format&fit=crop" alt="Japan Banner" class="app-banner">
        <h1>🇯🇵 N5 Typing Master</h1>
    </div>

    <!-- Bộ chọn danh mục & độ khó -->
    <div class="controls" id="controls">
        <select id="categorySelect">
            <option value="all">🔥 Tổng hợp tất cả (Hỗn hợp)</option>
            <option value="katakana">Chữ cứng Katakana (N5)</option>
            <option value="hiragana">Từ vựng Hiragana (N5)</option>
            <option value="sentences">Mẫu câu tự luận (N5)</option>
        </select>
        <select id="difficultySelect">
            <option value="60">Thời gian: Dễ (60 Giây)</option>
            <option value="45">Thời gian: Trung bình (45 Giây)</option>
            <option value="30">Thời gian: Khó (30 Giây)</option>
        </select>
    </div>

    <!-- Thanh chỉ số -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="label">Thời gian</div>
            <div class="value" id="timer">60s</div>
        </div>
        <div class="stat-item">
            <div class="label">Combo</div>
            <div class="value" id="combo">x0</div>
        </div>
        <div class="stat-item">
            <div class="label">Điểm số</div>
            <div class="value" id="score">0</div>
        </div>
    </div>

    <!-- Khung gõ bài -->
    <div id="gamePlayArea" class="hidden">
        <div class="card">
            <img id="targetImage" src="" alt="Illustration" class="word-image">
            <div class="japanese-text" id="targetText">コーヒー</div>
            <div class="romaji-text" id="targetRomaji">ko-hi-</div>
            <div class="meaning-text" id="targetMeaning">Cà phê</div>
        </div>

        <div class="input-group" style="margin-top: 8px;">
            <input type="text" id="userInput" placeholder="Gõ bằng bàn phím Nhật..." autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="tip-text">💡 Dùng bàn phím Kana/Romaji Tiếng Nhật để gõ.</div>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div id="resultArea" class="card result-screen hidden">
        <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" alt="Trophy" class="result-image">
        <h2>🎉 KẾT THÚC BÀI THI!</h2>
        <p>Điểm số: <strong id="finalScore" style="color: var(--primary); font-size: 20px;">0</strong></p>
        <p>Số từ gõ đúng: <strong id="finalCount">0</strong></p>
        <div class="grade-badge" id="finalGrade">Rank: S</div>
    </div>

    <!-- Nút bắt đầu / dừng -->
    <button id="actionBtn">Bắt Đầu Luyện Gõ</button>
</div>

<script>
    const vocabulary = {
        katakana: [
            { text: "コーヒー", romaji: "ko-hi-", meaning: "Cà phê", score: 15, img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=300" },
            { text: "ホテル", romaji: "hoteru", meaning: "Khách sạn", score: 15, img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300" },
            { text: "タクシー", romaji: "takushi-", meaning: "Xe taxi", score: 15, img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=300" },
            { text: "バス", romaji: "basu", meaning: "Xe buýt", score: 10, img: "https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=300" },
            { text: "パソコン", romaji: "pasokon", meaning: "Máy tính", score: 15, img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" }
        ],
        hiragana: [
            { text: "わたし", romaji: "watashi", meaning: "Tôi", score: 10, img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" },
            { text: "せんせい", romaji: "sensei", meaning: "Thầy/cô giáo", score: 12, img: "https://images.unsplash.com/photo-1577896851231-70ef18881754?w=300" },
            { text: "がくせい", romaji: "gakusei", meaning: "Học sinh/sinh viên", score: 12, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=300" },
            { text: "ほん", romaji: "hon", meaning: "Sách", score: 10, img: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=300" }
        ],
        sentences: [
            { text: "わたしはがくせいです。", romaji: "Watashi wa gakusei desu.", meaning: "Tôi là sinh viên.", score: 30, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=300" },
            { text: "きょうはいいてんきですね。", romaji: "Kyou wa ii tenki desu ne.", meaning: "Hôm nay trời đẹp nhỉ.", score: 35, img: "https://images.unsplash.com/photo-1601297183305-6df142704ea2?w=300" }
        ]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let combo = 0;
    let typedCount = 0;
    let timeRemaining = 60;
    let timerInterval = null;
    let isPlaying = false;

    const categorySelect = document.getElementById('categorySelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const controls = document.getElementById('controls');
    const timerEl = document.getElementById('timer');
    const comboEl = document.getElementById('combo');
    const scoreEl = document.getElementById('score');
    const gamePlayArea = document.getElementById('gamePlayArea');
    const resultArea = document.getElementById('resultArea');
    const targetImage = document.getElementById('targetImage');
    const targetText = document.getElementById('targetText');
    const targetRomaji = document.getElementById('targetRomaji');
    const targetMeaning = document.getElementById('targetMeaning');
    const userInput = document.getElementById('userInput');
    const actionBtn = document.getElementById('actionBtn');

    actionBtn.addEventListener('click', () => {
        if (isPlaying) {
            endGame();
        } else {
            startGame();
        }
    });

    userInput.addEventListener('input', (e) => {
        checkInput(e.target.value);
    });

    function startGame() {
        const cat = categorySelect.value;
        if (cat === 'all') {
            currentQuestions = [
                ...vocabulary.katakana,
                ...vocabulary.hiragana,
                ...vocabulary.sentences
            ].sort(() => Math.random() - 0.5);
        } else {
            currentQuestions = [...vocabulary[cat]].sort(() => Math.random() - 0.5);
        }
        
        currentIndex = 0;
        score = 0;
        combo = 0;
        typedCount = 0;
        timeRemaining = parseInt(difficultySelect.value);
        isPlaying = true;

        controls.classList.add('hidden');
        resultArea.classList.add('hidden');
        gamePlayArea.classList.remove('hidden');
        actionBtn.textContent = 'Hủy / Dừng Lại';
        actionBtn.classList.add('danger');

        scoreEl.textContent = '0';
        comboEl.textContent = 'x0';
        timerEl.textContent = timeRemaining + 's';
        userInput.value = '';

        loadQuestion();
        userInput.focus();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timerEl.textContent = timeRemaining + 's';
            if (timeRemaining <= 0) {
                endGame();
            }
        }, 1000);
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
        }
        const q = currentQuestions[currentIndex];
        targetImage.src = q.img;
        targetText.textContent = q.text;
        targetRomaji.textContent = q.romaji;
        targetMeaning.textContent = "Nghĩa: " + q.meaning;
    }

    function checkInput(val) {
        if (!isPlaying) return;
        const q = currentQuestions[currentIndex];
        
        if (val.trim() === q.text) {
            combo++;
            typedCount++;
            score += q.score * combo;

            scoreEl.textContent = score;
            comboEl.textContent = 'x' + combo;
            userInput.value = '';

            currentIndex++;
            loadQuestion();
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        isPlaying = false;

        gamePlayArea.classList.add('hidden');
        controls.classList.remove('hidden');
        resultArea.classList.remove('hidden');

        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalCount').textContent = typedCount;
        document.getElementById('finalGrade').textContent = "Rank: " + getGrade(score);

        actionBtn.textContent = 'Luyện Lại Bài Khác';
        actionBtn.classList.remove('danger');
    }

    function getGrade(sc) {
        if (sc >= 200) return "S (Thành Thạo)";
        if (sc >= 120) return "A (Rất Tốt)";
        if (sc >= 60)  return "B (Khá)";
        return "C (Cần Luyện Thêm)";
    }
</script>
</body>
</html>
